<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KrishiBot — Smart Farming Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4e8; min-height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .header { background: linear-gradient(135deg, #2d6a2d, #4a9a4a); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .header-icon { font-size: 2rem; }
    .header-text h1 { font-size: 1.4rem; font-weight: 700; }
    .header-text p { font-size: 0.8rem; opacity: 0.85; }
    .header-icons { margin-left: auto; font-size: 1.5rem; }

    /* Language Bar */
    .lang-bar { background: #e8f5e9; padding: 8px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #c8e6c9; flex-wrap: wrap; }
    .lang-bar span { font-size: 0.8rem; color: #555; font-weight: 600; }
    .lang-btn { padding: 4px 14px; border-radius: 20px; border: 2px solid #4a9a4a; background: white; color: #2d6a2d; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-weight: 600; }
    .lang-btn.active { background: #2d6a2d; color: white; }
    .lang-btn:hover { background: #4a9a4a; color: white; }

    /* Quick Actions */
    .quick-actions { padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; background: white; border-bottom: 1px solid #e0e0e0; }
    .quick-actions::-webkit-scrollbar { height: 4px; }
    .quick-actions::-webkit-scrollbar-thumb { background: #c8e6c9; border-radius: 4px; }
    .qa-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #4a9a4a; background: white; color: #2d6a2d; font-size: 0.78rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-weight: 500; }
    .qa-btn:hover { background: #e8f5e9; }

    /* Chat Area */
    .chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 860px; width: 100%; margin: 0 auto; }

    /* Messages */
    .msg { display: flex; gap: 10px; max-width: 80%; animation: fadeIn 0.3s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .bot .avatar { background: #2d6a2d; }
    .user .avatar { background: #ff8c00; }

    .bubble { padding: 10px 14px; border-radius: 16px; line-height: 1.55; font-size: 0.9rem; max-width: 100%; }
    .user .bubble { background: #2d6a2d; color: white; border-bottom-right-radius: 4px; }
    .bot .bubble { background: white; color: #222; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    .bubble strong { font-weight: 700; }
    .bubble .tag { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .tag.weather { background: #e3f2fd; color: #1565c0; }
    .tag.crop { background: #e8f5e9; color: #2e7d32; }
    .tag.pest { background: #fce4ec; color: #c62828; }
    .tag.fertilizer { background: #f3e5f5; color: #6a1b9a; }
    .tag.ai { background: #fff3e0; color: #e65100; }
    .tag.system { background: #fafafa; color: #666; }

    /* Weather Card */
    .weather-card { background: linear-gradient(135deg, #1565c0, #42a5f5); color: white; border-radius: 14px; padding: 16px; margin-top: 6px; }
    .weather-main { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .weather-temp { font-size: 2.5rem; font-weight: 700; }
    .weather-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .weather-detail { background: rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 10px; font-size: 0.82rem; }
    .weather-advice { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; line-height: 1.5; }

    /* Location Card */
    .location-card { background: #e8f5e9; border: 1.5px solid #4a9a4a; border-radius: 12px; padding: 12px 16px; }
    .loc-btn { background: #2d6a2d; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; margin-top: 8px; font-weight: 600; transition: background 0.2s; }
    .loc-btn:hover { background: #1b5e1b; }

    /* Typing */
    .typing { display: flex; align-items: center; gap: 5px; padding: 10px 14px; }
    .typing span { width: 8px; height: 8px; background: #aaa; border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

    /* Input */
    .input-bar { background: white; border-top: 1.5px solid #e0e0e0; padding: 10px 16px; display: flex; gap: 10px; align-items: flex-end; max-width: 860px; width: 100%; margin: 0 auto; }
    .loc-icon-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 8px; border-radius: 50%; transition: background 0.2s; flex-shrink: 0; }
    .loc-icon-btn:hover { background: #e8f5e9; }
    .msg-input { flex: 1; border: 1.5px solid #ccc; border-radius: 22px; padding: 10px 16px; font-size: 0.9rem; resize: none; outline: none; max-height: 100px; min-height: 42px; transition: border-color 0.2s; font-family: inherit; }
    .msg-input:focus { border-color: #4a9a4a; }
    .send-btn { background: #2d6a2d; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
    .send-btn:hover:not(:disabled) { background: #1b5e1b; }
    .send-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* Footer */
    .footer { text-align: center; font-size: 0.72rem; color: #888; padding: 6px; background: white; border-top: 1px solid #eee; }

    /* Markdown-like formatting */
    .bubble p { margin-bottom: 6px; }
    .bubble ul { padding-left: 18px; margin: 4px 0; }
    .bubble li { margin-bottom: 3px; }

    @media (max-width: 600px) {
      .msg { max-width: 92%; }
      .header-text h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-icon">🌱</div>
  <div class="header-text">
    <h1>KrishiBot</h1>
    <p>Smart Farming Assistant · किसान मित्र</p>
  </div>
  <div class="header-icons">🌿 🍃 🌾</div>
</div>

<!-- Language Bar -->
<div class="lang-bar">
  <span>Language:</span>
  <button class="lang-btn active" onclick="setLang('en')" id="lang-en">🇬🇧 English</button>
  <button class="lang-btn" onclick="setLang('hi')" id="lang-hi">🇮🇳 हिंदी</button>
  <button class="lang-btn" onclick="setLang('kn')" id="lang-kn">🏳️ ಕನ್ನಡ</button>
</div>

<!-- Quick Actions -->
<div class="quick-actions">
  <button class="qa-btn" onclick="quickSend('weather')">🌦️ Weather</button>
  <button class="qa-btn" onclick="quickSend('What crops should I grow in black soil kharif season?')">🌾 Crop Advice</button>
  <button class="qa-btn" onclick="quickSend('My crop has aphids, how to treat?')">🐛 Pest Help</button>
  <button class="qa-btn" onclick="quickSend('Fertilizer recommendation for rice')">🧪 Fertilizer</button>
  <button class="qa-btn" onclick="quickSend('Why are my crop leaves turning yellow?')">🍂 Yellow Leaves</button>
  <button class="qa-btn" onclick="quickSend('How to increase crop yield?')">📈 Increase Yield</button>
  <button class="qa-btn" onclick="quickSend('Tell me about PM Kisan scheme')">🏛️ Govt Schemes</button>
</div>

<!-- Chat Area -->
<div class="chat-area" id="chat-area"></div>

<!-- Input Bar -->
<div class="input-bar">
  <button class="loc-icon-btn" onclick="shareLocation()" title="Share Location">📍</button>
  <textarea class="msg-input" id="msg-input" placeholder="Ask me anything about farming... (e.g., 'Best crop for black soil')" rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
    oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
</div>

<!-- Footer -->
<div class="footer">
  📞 Kisan Helpline: <strong>1800-180-1551</strong> (Free · 24x7) | Powered by KrishiBot AI
</div>

<script>
// ─────────────────────────────────────────────
// Config — Backend URL
// ─────────────────────────────────────────────
const RENDER_BACKEND = 'https://krishibot-api.onrender.com';
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:5000'
  : RENDER_BACKEND;

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let currentLang = 'en';
let userLocation = null;
let isLoading = false;
let context = { history: [] };

// ─────────────────────────────────────────────
// Language
// ─────────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('lang-' + lang).classList.add('active');
}

// ─────────────────────────────────────────────
// Chat UI Helpers
// ─────────────────────────────────────────────
function scrollToBottom() {
  const ca = document.getElementById('chat-area');
  ca.scrollTop = ca.scrollHeight;
}

function formatText(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function addUserMessage(text) {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar">👨‍🌾</div><div class="bubble">${text}</div>`;
  ca.appendChild(div);
  scrollToBottom();
}

function addBotMessage(content, type = 'ai') {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';

  const tagLabels = {
    weather: '🌦️ Weather', crop_advice: '🌾 Crop Advisor', pest_advice: '🐛 Pest Advisor',
    fertilizer: '🧪 Fertilizer', ai: '🤖 AI Assistant', system: '⚠️ System', error: '❌ Error'
  };
  const tagClass = {
    weather: 'weather', crop_advice: 'crop', pest_advice: 'pest',
    fertilizer: 'fertilizer', ai: 'ai', system: 'system', error: 'system'
  };

  const tag = tagLabels[type] || '🤖 AI Assistant';
  const cls = tagClass[type] || 'ai';

  div.innerHTML = `
    <div class="avatar">🌱</div>
    <div class="bubble">
      <span class="tag ${cls}">${tag}</span><br>
      ${formatText(content)}
    </div>`;
  ca.appendChild(div);
  scrollToBottom();
}

function addWeatherCard(data) {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="avatar">🌱</div>
    <div class="bubble">
      <span class="tag weather">🌦️ Weather</span>
      <div class="weather-card">
        <div class="weather-main">
          <div class="weather-temp">${data.temperature}°C</div>
          <div>
            <div style="font-size:1.1rem;font-weight:600">${data.condition}</div>
            <div style="font-size:0.85rem;opacity:0.85">📍 ${data.location}</div>
          </div>
        </div>
        <div class="weather-details">
          <div class="weather-detail">💧 Humidity: ${data.humidity}%</div>
          <div class="weather-detail">🌬️ Wind: ${data.wind_speed} m/s</div>
        </div>
        <div class="weather-advice">${data.farming_advice}</div>
      </div>
    </div>`;
  ca.appendChild(div);
  scrollToBottom();
}

function addLocationCard() {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="avatar">🌱</div>
    <div class="bubble">
      <span class="tag weather">📍 Location</span><br>
      To get weather information, I need your location.
      <br><br>
      <div class="location-card">
        <strong>Share your location for:</strong><br>
        🌡️ Real-time temperature & humidity<br>
        🌧️ Rain prediction<br>
        🌾 Farming advice based on your weather<br>
        <button class="loc-btn" onclick="shareLocation()">📍 Share My Location</button>
      </div>
    </div>`;
  ca.appendChild(div);
  scrollToBottom();
}

function addTyping() {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="avatar">🌱</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  ca.appendChild(div);
  scrollToBottom();
  return div.id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ─────────────────────────────────────────────
// Location
// ─────────────────────────────────────────────
function shareLocation() {
  if (!navigator.geolocation) {
    addBotMessage('❌ Geolocation is not supported by your browser.', 'system');
    return;
  }
  addBotMessage('📍 Getting your location...', 'system');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      addBotMessage(`✅ Location received! Now ask me about the **weather** for real-time farming advice.`, 'weather');
    },
    () => {
      addBotMessage('❌ Could not get location. Please allow location access in your browser settings.', 'system');
    }
  );
}

// ─────────────────────────────────────────────
// Quick Send
// ─────────────────────────────────────────────
function quickSend(text) {
  if (text === 'weather') {
    if (userLocation) {
      document.getElementById('msg-input').value = 'weather';
      sendMessage();
    } else {
      shareLocation();
    }
    return;
  }
  document.getElementById('msg-input').value = text;
  sendMessage();
}

// ─────────────────────────────────────────────
// Send Message
// ─────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  addUserMessage(text);
  const typingId = addTyping();

  try {
    const payload = {
      message: text,
      language: currentLang,
      context: context
    };
    if (userLocation) {
      payload.lat = userLocation.lat;
      payload.lon = userLocation.lon;
    }

    // 60 second timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    removeTyping(typingId);

    if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
    const data = await resp.json();

    // Update context history
    context.history = context.history || [];
    context.history.push({ role: 'user', content: text });
    if (data.message) context.history.push({ role: 'assistant', content: data.message });
    if (context.history.length > 20) context.history = context.history.slice(-20);

    // Handle response types
    if (data.status === 'weather' && data.data) {
      addWeatherCard(data.data);
    } else if (data.status === 'needs_location') {
      addLocationCard();
    } else if (data.message) {
      addBotMessage(data.message, data.status || 'ai');
    } else {
      addBotMessage('Sorry, I did not understand. Please try again.', 'system');
    }

  } catch (err) {
    removeTyping(typingId);
    if (err.name === 'AbortError') {
      addBotMessage('⏳ The server is taking too long. It may be waking up — please wait 30 seconds and try again!', 'system');
    } else {
      addBotMessage('⚠️ Could not connect to server. Please check your internet connection and try again.', 'system');
    }
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(() => {
    addBotMessage(
      "**Namaste! 🙏 Welcome to KrishiBot!**\n\n" +
      "I can help you with:\n" +
      "🌦️ **Weather** — Click 📍 to share location\n" +
      "🌾 **Crop Advice** — Tell me your soil type & season\n" +
      "🐛 **Pest & Disease** — Describe what you see\n" +
      "🧪 **Fertilizer** — Tell me your crop name\n" +
      "💬 **Any farming question** — just ask!\n\n" +
      "नमस्ते किसान भाई! मुझसे खेती के बारे में कुछ भी पूछें। 🌱",
      'ai'
    );
  }, 300);
});
</script>
</body>
</html>
