services:
  - type: web
    name: krishibot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # You'll paste this in Render dashboard
      - key: DEBUG
        value: "false"
