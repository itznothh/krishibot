<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KrishiBot — Smart Farming Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --soil:       #3d2b1f;
      --bark:       #5c3d2e;
      --moss:       #4a7c59;
      --leaf:       #6aaa7a;
      --sprout:     #8fbc8f;
      --wheat:      #d4a853;
      --sand:       #f5ede0;
      --parchment:  #fdf6ec;
      --sky:        #e8f4fd;
      --clay:       #c8956c;
      --cream:      #fffbf4;
      --text-dark:  #1e1208;
      --text-mid:   #4a3728;
      --text-soft:  #7a6255;
      --shadow:     rgba(61,43,31,0.12);
      --radius:     18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--sand);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(106,170,122,0.08) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(212,168,83,0.08) 0%, transparent 50%);
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; width: 280px;
      background: var(--soil);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(.4,0,.2,1);
      z-index: 1000;
      box-shadow: 4px 0 24px rgba(0,0,0,0.3);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(30,18,8,0.55);
      backdrop-filter: blur(2px);
      z-index: 999;
    }
    .sidebar-overlay.open { display: block; }
    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-header h3 {
      font-family: 'Sora', sans-serif;
      font-size: 1rem; color: var(--wheat); letter-spacing: 0.3px;
    }
    .new-chat-btn {
      background: var(--moss); color: white; border: none;
      padding: 7px 13px; border-radius: 10px;
      cursor: pointer; font-size: 0.78rem; font-weight: 600;
      font-family: 'Nunito', sans-serif;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: var(--leaf); }
    .history-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .history-list::-webkit-scrollbar { width: 3px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .history-item {
      padding: 10px 12px; border-radius: 12px; cursor: pointer;
      margin-bottom: 4px; transition: background 0.2s;
      display: flex; align-items: center; gap: 10px;
    }
    .history-item:hover { background: rgba(255,255,255,0.07); }
    .history-item.active { background: rgba(106,170,122,0.25); }
    .history-item-icon { font-size: 1rem; flex-shrink: 0; opacity: 0.7; }
    .history-item-text { flex: 1; min-width: 0; }
    .history-title { font-size: 0.82rem; color: rgba(255,255,255,0.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-date { font-size: 0.68rem; color: rgba(255,255,255,0.35); margin-top: 2px; }
    .history-del {
      opacity: 0; font-size: 0.72rem; cursor: pointer;
      padding: 3px 7px; border-radius: 6px;
      background: rgba(200,60,60,0.25); border: none; color: rgba(255,255,255,0.6);
      transition: opacity 0.2s; flex-shrink: 0;
    }
    .history-item:hover .history-del { opacity: 1; }
    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 0.68rem; color: rgba(255,255,255,0.25); text-align: center;
    }

    /* ── Header ── */
    .header {
      background: var(--soil);
      color: white; padding: 0;
      display: flex; align-items: stretch;
      box-shadow: 0 3px 16px rgba(61,43,31,0.3);
      position: relative; z-index: 10;
    }
    .header-logo-wrap {
      display: flex; align-items: stretch; flex: 1; gap: 0;
    }
    .header-logo-left {
      background: linear-gradient(160deg, #3d2b1f, #5c3d2e);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .header-logo-right {
      padding: 12px 14px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .header-logo-name {
      font-family: 'Sora', sans-serif;
      font-size: 1.2rem; font-weight: 700; color: white; line-height: 1.1;
    }
    .header-logo-name span { color: var(--wheat); }
    .header-logo-sub {
      font-size: 0.68rem; color: rgba(255,255,255,0.4);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-top: 3px; font-weight: 600;
    }
    .header-right { display: flex; align-items: center; padding-right: 14px; }
    .sidebar-toggle {
      background: rgba(255,255,255,0.08); border: none; color: white;
      font-size: 1.1rem; cursor: pointer; padding: 8px 11px;
      border-radius: 10px; transition: background 0.2s;
    }
    .sidebar-toggle:hover { background: rgba(255,255,255,0.16); }

    /* ── Language Bar ── */
    .lang-bar {
      background: var(--bark);
      padding: 8px 16px;
      display: flex; align-items: center; gap: 8px;
      overflow-x: auto;
    }
    .lang-bar::-webkit-scrollbar { display: none; }
    .lang-label { font-size: 0.72rem; color: rgba(255,255,255,0.45); font-weight: 600; white-space: nowrap; }
    .lang-btn {
      padding: 5px 14px; border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: transparent; color: rgba(255,255,255,0.65);
      font-size: 0.78rem; cursor: pointer;
      transition: all 0.2s; font-weight: 500;
      font-family: 'Nunito', sans-serif;
      white-space: nowrap;
    }
    .lang-btn.active {
      background: var(--wheat); color: var(--soil);
      border-color: var(--wheat); font-weight: 700;
    }
    .lang-btn:hover:not(.active) { border-color: rgba(255,255,255,0.5); color: white; }

    /* ── Quick Actions ── */
    .quick-actions {
      padding: 10px 14px; display: flex; gap: 8px;
      overflow-x: auto; background: var(--cream);
      border-bottom: 1px solid rgba(61,43,31,0.08);
    }
    .quick-actions::-webkit-scrollbar { display: none; }
    .qa-btn {
      padding: 7px 14px; border-radius: 20px;
      border: 1.5px solid rgba(74,124,89,0.3);
      background: white; color: var(--moss);
      font-size: 0.78rem; cursor: pointer; white-space: nowrap;
      transition: all 0.2s; font-weight: 500;
      font-family: 'Nunito', sans-serif;
      box-shadow: 0 1px 4px var(--shadow);
    }
    .qa-btn:hover { background: var(--moss); color: white; border-color: var(--moss); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(74,124,89,0.25); }

    /* ── Chat Area ── */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 18px 14px;
      display: flex; flex-direction: column; gap: 16px;
      max-width: 720px; width: 100%; margin: 0 auto;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(61,43,31,0.15); border-radius: 4px; }

    /* ── Messages ── */
    .msg { display: flex; gap: 10px; animation: msgIn 0.3s cubic-bezier(.4,0,.2,1); }
    .msg.user { flex-direction: row-reverse; }
    .msg.bot { }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0; margin-top: 2px;
    }
    .bot .avatar {
      background: linear-gradient(135deg, var(--soil), var(--moss));
      box-shadow: 0 2px 8px rgba(61,43,31,0.3);
    }
    .user .avatar {
      background: linear-gradient(135deg, var(--clay), var(--wheat));
      box-shadow: 0 2px 8px rgba(200,149,108,0.3);
    }

    /* Bot bubble */
    .bot .bubble {
      background: white;
      border-radius: 4px 18px 18px 18px;
      padding: 12px 16px;
      color: var(--text-dark);
      font-size: 0.9rem;
      line-height: 1.65;
      box-shadow: 0 2px 12px var(--shadow);
      max-width: calc(100% - 44px);
      border: 1px solid rgba(61,43,31,0.06);
      position: relative;
    }

    /* User bubble */
    .user .bubble {
      background: linear-gradient(135deg, var(--soil), var(--bark));
      border-radius: 18px 4px 18px 18px;
      padding: 12px 16px;
      color: white;
      font-size: 0.9rem;
      line-height: 1.6;
      box-shadow: 0 2px 12px rgba(61,43,31,0.25);
      max-width: calc(100% - 44px);
    }

    /* Tags */
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.68rem; font-weight: 700; padding: 3px 9px;
      border-radius: 20px; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .tag.weather { background: #e3f0fb; color: #1a5276; border: 1px solid #b8d4ef; }
    .tag.crop    { background: #e8f5e9; color: #1b5e20; border: 1px solid #c5e1c5; }
    .tag.pest    { background: #fce8e8; color: #922b21; border: 1px solid #f1b8b8; }
    .tag.fertilizer { background: #f3e8fb; color: #6a1b9a; border: 1px solid #d9b8f1; }
    .tag.ai      { background: #fef3e2; color: #784212; border: 1px solid #f0d4a0; }
    .tag.system  { background: #f4f4f4; color: #555; border: 1px solid #ddd; }
    .tag.image   { background: #e8f5e9; color: #1b5e20; border: 1px solid #c5e1c5; }

    /* Bubble text formatting */
    .bubble strong { font-weight: 700; color: var(--moss); }
    .user .bubble strong { color: var(--wheat); }
    .bubble ul { padding-left: 18px; margin: 6px 0; }
    .bubble li { margin-bottom: 4px; }
    .bubble p { margin-bottom: 6px; }

    /* ── Weather Card ── */
    .weather-card {
      background: linear-gradient(135deg, #1a4a7a, #2980b9);
      color: white; border-radius: 14px; padding: 16px; margin-top: 8px;
      box-shadow: 0 4px 16px rgba(26,74,122,0.3);
    }
    .weather-main { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .weather-temp { font-size: 2.8rem; font-weight: 700; font-family: 'Sora', sans-serif; }
    .weather-loc { font-size: 0.78rem; opacity: 0.75; margin-top: 2px; }
    .weather-cond { font-size: 1rem; font-weight: 600; }
    .weather-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .weather-detail {
      background: rgba(255,255,255,0.12); border-radius: 10px;
      padding: 7px 11px; font-size: 0.8rem;
    }
    .weather-advice {
      background: rgba(255,255,255,0.1); border-radius: 10px;
      padding: 10px 13px; font-size: 0.83rem; line-height: 1.55;
      border-left: 3px solid rgba(255,255,255,0.4);
    }

    /* ── Location Card ── */
    .location-card {
      background: linear-gradient(135deg, #f0f7f0, #e8f5e9);
      border: 1.5px solid var(--sprout); border-radius: 14px;
      padding: 14px 16px; margin-top: 8px;
    }
    .loc-btn {
      background: var(--moss); color: white; border: none;
      padding: 9px 20px; border-radius: 20px; cursor: pointer;
      font-size: 0.84rem; margin-top: 10px; font-weight: 600;
      font-family: 'Nunito', sans-serif;
      transition: all 0.2s; box-shadow: 0 2px 8px rgba(74,124,89,0.3);
    }
    .loc-btn:hover { background: var(--soil); transform: translateY(-1px); }

    /* ── Typing ── */
    .typing { display: flex; align-items: center; gap: 5px; padding: 4px 0; }
    .typing span {
      width: 8px; height: 8px;
      background: var(--sprout); border-radius: 50%;
      animation: bounce 1.3s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; background: var(--moss); }
    .typing span:nth-child(3) { animation-delay: 0.3s; background: var(--soil); }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-7px) scale(1.1); }
    }

    /* ── Input Bar ── */
    .input-bar {
      background: white;
      border-top: 1px solid rgba(61,43,31,0.1);
      padding: 12px 14px;
      display: flex; gap: 8px; align-items: flex-end;
      max-width: 720px; width: 100%; margin: 0 auto;
      box-shadow: 0 -4px 20px rgba(61,43,31,0.06);
    }
    .icon-btn {
      background: var(--sand); border: 1.5px solid rgba(61,43,31,0.15);
      cursor: pointer; padding: 11px;
      border-radius: 14px; transition: all 0.2s; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-mid);
      box-shadow: 0 1px 4px var(--shadow);
    }
    .icon-btn:hover { background: var(--moss); border-color: var(--moss); transform: translateY(-1px); color: white; box-shadow: 0 3px 10px rgba(74,124,89,0.3); }
    .icon-btn.recording { background: #fee; border-color: #e74c3c; color: #e74c3c; animation: micpulse 1s infinite; }
    @keyframes micpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    .msg-input {
      flex: 1; border: 1.5px solid rgba(61,43,31,0.15);
      border-radius: 16px; padding: 11px 16px;
      font-size: 0.9rem; resize: none; outline: none;
      max-height: 120px; min-height: 44px;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Nunito', sans-serif;
      background: var(--parchment); color: var(--text-dark);
      line-height: 1.5;
    }
    .msg-input::placeholder { color: var(--text-soft); }
    .msg-input:focus {
      border-color: var(--moss);
      box-shadow: 0 0 0 3px rgba(74,124,89,0.12);
      background: white;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--moss), var(--soil));
      color: white; border: none; width: 44px; height: 44px;
      border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
      box-shadow: 0 3px 12px rgba(74,124,89,0.4);
    }
    .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(74,124,89,0.5); }
    .send-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

    /* ── Footer ── */
    .footer {
      text-align: center; font-size: 0.7rem;
      color: var(--text-soft); padding: 7px;
      background: var(--cream);
      border-top: 1px solid rgba(61,43,31,0.06);
    }
    .footer strong { color: var(--soil); }

    /* ── Image Preview ── */
    .image-preview { max-width: 180px; border-radius: 10px; margin-top: 8px; border: 2px solid var(--sprout); display: block; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .msg { gap: 8px; }
      .bot .bubble, .user .bubble { max-width: calc(100% - 42px); font-size: 0.88rem; }
      .header-text h1 { font-size: 1.1rem; }
      .chat-area { padding: 14px 10px; gap: 13px; }
      .input-bar { padding: 10px 10px; }
      .weather-temp { font-size: 2.2rem; }
    }

    #image-input { display: none; }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>🌾 Chat History</h3>
    <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
  </div>
  <div class="history-list" id="history-list"></div>
  <div class="sidebar-footer">Saved on this device only</div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-logo-wrap">
    <div class="header-logo-left">
      <svg width="28" height="40" viewBox="0 0 32 44" fill="none">
        <line x1="16" y1="42" x2="16" y2="8" stroke="#d4a853" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="10" cy="14" rx="5" ry="8" fill="#d4a853" opacity="0.9" transform="rotate(-22 10 14)"/>
        <ellipse cx="9" cy="24" rx="5" ry="8" fill="#d4a853" opacity="0.7" transform="rotate(-18 9 24)"/>
        <ellipse cx="10" cy="33" rx="5" ry="8" fill="#d4a853" opacity="0.5" transform="rotate(-14 10 33)"/>
        <ellipse cx="22" cy="14" rx="5" ry="8" fill="#6aaa7a" opacity="0.9" transform="rotate(22 22 14)"/>
        <ellipse cx="23" cy="24" rx="5" ry="8" fill="#6aaa7a" opacity="0.7" transform="rotate(18 23 24)"/>
        <ellipse cx="22" cy="33" rx="5" ry="8" fill="#6aaa7a" opacity="0.5" transform="rotate(14 22 33)"/>
        <ellipse cx="16" cy="9" rx="4" ry="7" fill="white"/>
      </svg>
    </div>
    <div class="header-logo-right">
      <div class="header-logo-name">Krishi<span>Bot</span></div>
      <div class="header-logo-sub">Smart Farming AI</div>
    </div>
  </div>
  <div class="header-right">
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Chat History">☰</button>
  </div>
</div>

<!-- Language Bar -->
<div class="lang-bar">
  <span class="lang-label">Lang:</span>
  <button class="lang-btn active" onclick="setLang('en')" id="lang-en">🇬🇧 English</button>
  <button class="lang-btn" onclick="setLang('hi')" id="lang-hi">🇮🇳 हिंदी</button>
  <button class="lang-btn" onclick="setLang('kn')" id="lang-kn">🏳️ ಕನ್ನಡ</button>
</div>

<!-- Quick Actions -->
<div class="quick-actions">
  <button class="qa-btn" onclick="quickSend('weather')">🌦️ Weather</button>
  <button class="qa-btn" onclick="quickSend('What crops should I grow in black soil kharif season?')">🌾 Crop Advice</button>
  <button class="qa-btn" onclick="quickSend('My crop has aphids, how to treat?')">🐛 Pest Help</button>
  <button class="qa-btn" onclick="quickSend('Fertilizer recommendation for rice')">🧪 Fertilizer</button>
  <button class="qa-btn" onclick="quickSend('Why are my crop leaves turning yellow?')">🍂 Yellow Leaves</button>
  <button class="qa-btn" onclick="quickSend('How to increase crop yield?')">📈 Increase Yield</button>
  <button class="qa-btn" onclick="quickSend('Tell me about PM Kisan scheme')">🏛️ Govt Schemes</button>
</div>

<!-- Chat Area -->
<div class="chat-area" id="chat-area"></div>

<!-- Hidden image input -->
<input type="file" id="image-input" accept="image/*" capture="environment" onchange="handleImageUpload(event)">

<!-- Input Bar -->
<div class="input-bar">
  <button class="icon-btn" onclick="shareLocation()" title="Share Location">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
  </button>
  <button class="icon-btn" onclick="document.getElementById('image-input').click()" title="Scan Crop Disease">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <button class="icon-btn" id="mic-btn" onclick="toggleVoice()" title="Voice Input">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
  </button>
  <textarea class="msg-input" id="msg-input"
    placeholder="Ask me anything about farming..."
    rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
    oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<!-- Footer -->
<div class="footer">
  📞 Kisan Helpline: <strong>1800-180-1551</strong> (Free · 24x7) | Powered by KrishiBot AI
</div>

<script>
// ─────────────────────────────────────────────
// Config — Backend URL
// ─────────────────────────────────────────────
const RENDER_BACKEND = 'https://krishibot-api.onrender.com';
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:5000'
  : RENDER_BACKEND;

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let currentLang = 'en';
let userLocation = null;
let isLoading = false;
let context = { history: [] };
let currentChatId = null;
let sidebarOpen = false;

// ─────────────────────────────────────────────
// History / localStorage
// ─────────────────────────────────────────────
const STORAGE_KEY = 'krishibot_chats';

function getAllChats() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveAllChats(chats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function generateId() {
  return 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
}

function getCurrentChat() {
  const chats = getAllChats();
  return chats[currentChatId] || null;
}

function saveChatMessage(role, content, type) {
  if (!currentChatId) return;
  const chats = getAllChats();
  if (!chats[currentChatId]) return;
  chats[currentChatId].messages.push({ role, content, type, ts: Date.now() });
  // Update title from first user message
  if (role === 'user' && chats[currentChatId].messages.filter(m => m.role === 'user').length === 1) {
    chats[currentChatId].title = content.slice(0, 40) + (content.length > 40 ? '...' : '');
  }
  chats[currentChatId].updatedAt = Date.now();
  saveAllChats(chats);
  renderSidebar();
}

function startNewChat() {
  // Save current chat first
  saveCurrentContext();
  
  currentChatId = generateId();
  const chats = getAllChats();
  chats[currentChatId] = {
    id: currentChatId,
    title: 'New Chat',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    messages: [],
    context: { history: [] }
  };
  saveAllChats(chats);

  // Clear UI
  document.getElementById('chat-area').innerHTML = '';
  context = { history: [] };
  userLocation = null;

  renderSidebar();
  closeSidebar();

  // Show welcome message
  setTimeout(() => {
    addBotMessage(
      "**Namaste! 🙏 Welcome to KrishiBot!**\n\n" +
      "I can help you with:\n" +
      "🌦️ **Weather** — Click 📍 to share location\n" +
      "🌾 **Crop Advice** — Tell me your soil type & season\n" +
      "🐛 **Pest & Disease** — Describe what you see\n" +
      "🧪 **Fertilizer** — Tell me your crop name\n" +
      "💬 **Any farming question** — just ask!\n\n" +
      "Select your language above 🌐 | ऊपर भाषा चुनें | ಮೇಲೆ ಭಾಷೆ ಆಯ್ಕೆ ಮಾಡಿ 🌱",
      'ai'
    );
  }, 200);
}

function saveCurrentContext() {
  if (!currentChatId) return;
  const chats = getAllChats();
  if (chats[currentChatId]) {
    chats[currentChatId].context = context;
    saveAllChats(chats);
  }
}

function loadChat(chatId) {
  saveCurrentContext();
  currentChatId = chatId;
  const chats = getAllChats();
  const chat = chats[chatId];
  if (!chat) return;

  // Restore context
  context = chat.context || { history: [] };

  // Clear and rebuild chat UI
  const ca = document.getElementById('chat-area');
  ca.innerHTML = '';

  chat.messages.forEach(msg => {
    if (msg.role === 'user') {
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerHTML = `<div class="avatar">👨‍🌾</div><div class="bubble">${msg.content}</div>`;
      ca.appendChild(div);
    } else {
      const div = document.createElement('div');
      div.className = 'msg bot';
      const tagLabels = { weather: '🌦️ Weather', crop_advice: '🌾 Crop Advisor', pest_advice: '🐛 Pest Advisor', fertilizer: '🧪 Fertilizer', ai: '🤖 AI Assistant', system: '⚠️ System' };
      const tagClass = { weather: 'weather', crop_advice: 'crop', pest_advice: 'pest', fertilizer: 'fertilizer', ai: 'ai', system: 'system' };
      const tag = tagLabels[msg.type] || '🤖 AI Assistant';
      const cls = tagClass[msg.type] || 'ai';
      div.innerHTML = `<div class="avatar">🌱</div><div class="bubble"><span class="tag ${cls}">${tag}</span><br>${formatText(msg.content)}</div>`;
      ca.appendChild(div);
    }
  });

  scrollToBottom();
  renderSidebar();
  closeSidebar();
}

function deleteChat(chatId, event) {
  event.stopPropagation();
  const chats = getAllChats();
  delete chats[chatId];
  saveAllChats(chats);
  
  if (currentChatId === chatId) {
    startNewChat();
  } else {
    renderSidebar();
  }
}

function renderSidebar() {
  const list = document.getElementById('history-list');
  const chats = getAllChats();
  const sorted = Object.values(chats).sort((a, b) => b.updatedAt - a.updatedAt);

  if (sorted.length === 0) {
    list.innerHTML = '<div style="padding:16px;opacity:0.4;font-size:0.8rem;text-align:center">No chat history yet</div>';
    return;
  }

  list.innerHTML = sorted.map(chat => {
    const date = new Date(chat.updatedAt);
    const dateStr = date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const isActive = chat.id === currentChatId;
    return `
      <div class="history-item ${isActive ? 'active' : ''}" onclick="loadChat('${chat.id}')">
        <div style="font-size:1rem">💬</div>
        <div class="history-item-text">
          <div class="history-title">${chat.title || 'New Chat'}</div>
          <div class="history-date">${dateStr}</div>
        </div>
        <button class="history-del" onclick="deleteChat('${chat.id}', event)">🗑️</button>
      </div>`;
  }).join('');
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('sidebar-overlay').classList.toggle('open', sidebarOpen);
}

function closeSidebar() {
  sidebarOpen = false;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ─────────────────────────────────────────────
// Language
// ─────────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('lang-' + lang).classList.add('active');
}

// ─────────────────────────────────────────────
// Chat UI Helpers
// ─────────────────────────────────────────────
function scrollToBottom() {
  const ca = document.getElementById('chat-area');
  ca.scrollTop = ca.scrollHeight;
}

function formatText(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function addUserMessage(text) {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar">👨‍🌾</div><div class="bubble">${text}</div>`;
  ca.appendChild(div);
  scrollToBottom();
  saveChatMessage('user', text, 'user');
}

function addBotMessage(content, type = 'ai') {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';

  const tagLabels = {
    weather: '🌦️ Weather', crop_advice: '🌾 Crop Advisor', pest_advice: '🐛 Pest Advisor',
    fertilizer: '🧪 Fertilizer', ai: '🤖 AI Assistant', system: '⚠️ System', error: '❌ Error'
  };
  const tagClass = {
    weather: 'weather', crop_advice: 'crop', pest_advice: 'pest',
    fertilizer: 'fertilizer', ai: 'ai', system: 'system', error: 'system'
  };

  const tag = tagLabels[type] || '🤖 AI Assistant';
  const cls = tagClass[type] || 'ai';

  div.innerHTML = `
    <div class="avatar">🌱</div>
    <div class="bubble">
      <span class="tag ${cls}">${tag}</span><br>
      ${formatText(content)}
    </div>`;
  ca.appendChild(div);
  scrollToBottom();
  saveChatMessage('bot', content, type);
}

function addWeatherCard(data) {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="avatar">🌱</div>
    <div class="bubble">
      <span class="tag weather">🌦️ Weather</span>
      <div class="weather-card">
        <div class="weather-main">
          <div class="weather-temp">${data.temperature}°C</div>
          <div>
            <div style="font-size:1.1rem;font-weight:600">${data.condition}</div>
            <div style="font-size:0.85rem;opacity:0.85">📍 ${data.location}</div>
          </div>
        </div>
        <div class="weather-details">
          <div class="weather-detail">💧 Humidity: ${data.humidity}%</div>
          <div class="weather-detail">🌬️ Wind: ${data.wind_speed} m/s</div>
        </div>
        <div class="weather-advice">${data.farming_advice || '🌾 Check conditions before planning field activities today.'}</div>
      </div>
    </div>`;
  ca.appendChild(div);
  scrollToBottom();
}

function addLocationCard() {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="avatar">🌱</div>
    <div class="bubble">
      <span class="tag weather">📍 Location</span><br>
      To get weather information, I need your location.
      <br><br>
      <div class="location-card">
        <strong>Share your location for:</strong><br>
        🌡️ Real-time temperature & humidity<br>
        🌧️ Rain prediction<br>
        🌾 Farming advice based on your weather<br>
        <button class="loc-btn" onclick="shareLocation()">📍 Share My Location</button>
      </div>
    </div>`;
  ca.appendChild(div);
  scrollToBottom();
}

function addTyping() {
  const ca = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="avatar">🌱</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  ca.appendChild(div);
  scrollToBottom();
  return div.id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ─────────────────────────────────────────────
// Location
// ─────────────────────────────────────────────
function shareLocation() {
  if (!navigator.geolocation) {
    addBotMessage('❌ Geolocation is not supported by your browser.', 'system');
    return;
  }
  addBotMessage('📍 Getting your location...', 'system');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      addBotMessage(`✅ Location received! Now ask me about the **weather** for real-time farming advice.`, 'weather');
    },
    () => {
      addBotMessage('❌ Could not get location. Please allow location access in your browser settings.', 'system');
    }
  );
}

// ─────────────────────────────────────────────
// Quick Send
// ─────────────────────────────────────────────
function quickSend(text) {
  if (text === 'weather') {
    if (userLocation) {
      document.getElementById('msg-input').value = 'weather';
      sendMessage();
    } else {
      shareLocation();
    }
    return;
  }
  document.getElementById('msg-input').value = text;
  sendMessage();
}

// ─────────────────────────────────────────────
// Send Message
// ─────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  addUserMessage(text);
  const typingId = addTyping();

  try {
    const payload = {
      message: text,
      language: currentLang,
      context: {
        ...context,
        user_language: currentLang,
        location_status: userLocation
          ? `User's GPS location is available (lat=${userLocation.lat}, lon=${userLocation.lon}). Location was successfully shared.`
          : "User has not shared GPS location yet. They can click the 📍 button."
      }
    };
    if (userLocation) {
      payload.lat = userLocation.lat;
      payload.lon = userLocation.lon;
    }

    // 60 second timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    removeTyping(typingId);

    if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
    const data = await resp.json();

    // Update context history
    context.history = context.history || [];
    context.history.push({ role: 'user', content: text });
    if (data.message) context.history.push({ role: 'assistant', content: data.message });
    if (context.history.length > 20) context.history = context.history.slice(-20);

    // Handle response types
    if (data.status === 'weather' && data.data) {
      addWeatherCard(data.data);
    } else if (data.status === 'needs_location') {
      addLocationCard();
    } else if (data.message) {
      addBotMessage(data.message, data.status || 'ai');
    } else {
      addBotMessage('Sorry, I did not understand. Please try again.', 'system');
    }

  } catch (err) {
    removeTyping(typingId);
    if (err.name === 'AbortError') {
      addBotMessage('⏳ The server is taking too long. It may be waking up — please wait 30 seconds and try again!', 'system');
    } else {
      addBotMessage('⚠️ Could not connect to server. Please check your internet connection and try again.', 'system');
    }
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

// ─────────────────────────────────────────────
// Image Analysis (NEW — Gemini Vision)
// ─────────────────────────────────────────────
async function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Show image preview in chat
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    const mimeType = file.type || 'image/jpeg';

    // Show user image bubble
    const ca = document.getElementById('chat-area');
    const imgDiv = document.createElement('div');
    imgDiv.className = 'msg user';
    imgDiv.innerHTML = `
      <div class="avatar">👨‍🌾</div>
      <div class="bubble">
        📷 Crop image sent for analysis<br>
        <img src="${e.target.result}" class="image-preview" alt="Crop image">
      </div>`;
    ca.appendChild(imgDiv);
    scrollToBottom();

    // Show typing
    const typingId = addTyping();
    document.getElementById('send-btn').disabled = true;
    isLoading = true;

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 60000);

      const resp = await fetch(`${API_BASE}/analyze-image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64, mime_type: mimeType }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      removeTyping(typingId);

      if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
      const data = await resp.json();

      // Show result
      const resultDiv = document.createElement('div');
      resultDiv.className = 'msg bot';
      resultDiv.innerHTML = `
        <div class="avatar">🌱</div>
        <div class="bubble">
          <span class="tag image">🔬 Disease Scanner</span><br>
          ${formatText(data.message || 'Could not analyze image.')}
        </div>`;
      ca.appendChild(resultDiv);
      scrollToBottom();

    } catch (err) {
      removeTyping(typingId);
      if (err.name === 'AbortError') {
        addBotMessage('⏳ Image analysis timed out. Please try again!', 'system');
      } else {
        addBotMessage('❌ Could not analyze image. Please try again.', 'system');
      }
    } finally {
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      // Reset file input so same image can be re-uploaded
      document.getElementById('image-input').value = '';
    }
  };
  reader.readAsDataURL(file);
}

// ─────────────────────────────────────────────
// Voice Recognition
// ─────────────────────────────────────────────
let recognition = null;
let isRecording = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Voice input is not supported in this browser. Please use Chrome or Edge.');
    return;
  }

  if (isRecording) {
    recognition.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();

  // Set language based on current selection
  const langMap = { en: 'en-IN', hi: 'hi-IN', kn: 'kn-IN' };
  recognition.lang = langMap[currentLang] || 'en-IN';
  recognition.continuous = false;
  recognition.interimResults = true;

  const micBtn = document.getElementById('mic-btn');
  const input = document.getElementById('msg-input');

  recognition.onstart = () => {
    isRecording = true;
    micBtn.querySelector('svg').style.stroke = '#e74c3c';
    micBtn.classList.add('recording');
    input.placeholder = 'Listening... speak now';
  };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    input.value = transcript;
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.querySelector('svg') && (micBtn.querySelector('svg').style.stroke = '');
    micBtn.classList.remove('recording');
    input.placeholder = "Ask me anything about farming... (e.g., 'Best crop for black soil')";
    // Auto-send if there's text
    if (input.value.trim()) {
      setTimeout(() => sendMessage(), 500);
    }
  };

  recognition.onerror = (event) => {
    isRecording = false;
    micBtn.querySelector('svg') && (micBtn.querySelector('svg').style.stroke = '');
    micBtn.classList.remove('recording');
    input.placeholder = "Ask me anything about farming... (e.g., 'Best crop for black soil')";
    if (event.error !== 'no-speech') {
      addBotMessage('❌ Voice input error: ' + event.error + '. Please try again.', 'system');
    }
  };

  recognition.start();
}

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
window.addEventListener('load', () => {
  renderSidebar();
  const chats = getAllChats();
  const sorted = Object.values(chats).sort((a, b) => b.updatedAt - a.updatedAt);
  if (sorted.length > 0) {
    // Load most recent chat
    loadChat(sorted[0].id);
  } else {
    // Start fresh
    startNewChat();
  }
});
</script>
